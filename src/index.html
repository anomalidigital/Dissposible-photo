<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wedding Photobooth</title>
  <!-- Relative base: the build works from the GitHub Pages sub-path and from any local folder. -->
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10231b">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- App UI: Nunito (controls) + Bungee (LCD shot counter). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Bungee&display=swap">
  <!-- Wedding home: Ballet (names, held invisible until loaded so the ink reveal never shows a fallback) + Jost. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..600;1,300..500&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>

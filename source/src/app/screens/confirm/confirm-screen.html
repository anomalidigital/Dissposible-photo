<div #backdrop class="cf-backdrop" aria-hidden="true"></div>

<div class="cf">
  <header #top class="cf-top">
    <div class="lcd-badge">{{ session.shotLabel() }}</div>
  </header>

  <div #area class="hand-area">
    <div #stage class="hand-stage">
      <img class="art hand-layer hand-back" src="img/hand-back.webp" alt="" draggable="false" />
      <div #slot class="tpl-slot">
        @for (src of holes(); track $index) {
          <div class="frame-hole" [class.hole-1]="$index === 0" [class.hole-2]="$index === 1">
            @if (src) {
              <img class="hole-photo" [src]="src" [alt]="'Photo ' + ($index + 1)" />
            } @else {
              <div class="hole-next">
                <svg viewBox="0 0 48 40" aria-hidden="true">
                  <path d="M4 11h7l3-5h12l3 5h6a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z" />
                  <circle cx="22" cy="23" r="7" />
                </svg>
                <span>Up next</span>
              </div>
            }
          </div>
        }
        <img class="art tpl-img" src="img/template-artworks.webp" alt="" draggable="false" />
      </div>
      <img class="art hand-layer hand-front" src="img/hand-front.webp" alt="" draggable="false" />
    </div>
  </div>

  <div #picker class="cf-picker" role="radiogroup" aria-label="Photo look">
    @for (filter of filters; track filter.id) {
      <button
        #chip
        type="button"
        role="radio"
        class="look"
        [class.is-active]="session.filterId() === filter.id"
        [attr.aria-checked]="session.filterId() === filter.id"
        (click)="choose(filter.id, chip)"
      >
        <span class="look-thumb">
          @if (session.thumbnails()[filter.id]; as thumb) {
            <img [src]="thumb" alt="" />
          }
        </span>
        <span class="look-name">{{ filter.name }}</span>
      </button>
    }
  </div>

  <footer #actions class="cf-actions">
    <button type="button" class="btn btn-molded btn-molded-light" (click)="retake.emit()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6" /></svg>
      Retake
    </button>
    <button type="button" class="btn btn-molded btn-molded-primary" (click)="accept.emit()">
      {{ session.isLastShot() ? 'Confirm' : 'Continue' }}
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6" /></svg>
    </button>
  </footer>
</div>

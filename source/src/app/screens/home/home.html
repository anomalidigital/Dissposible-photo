<div class="home-ground" aria-hidden="true"></div>

<app-floral-spray class="spray spray-tl" variant="a" aria-hidden="true" />
<app-floral-spray class="spray spray-br" variant="b" aria-hidden="true" />

<div class="petal-fall" aria-hidden="true">
  @for (petal of petals; track $index) {
    <span
      class="petal"
      [style.left.%]="petal.left"
      [style.--size]="petal.size + 'px'"
      [style.--dur]="petal.duration + 's'"
      [style.--delay]="petal.delay + 's'"
      [style.--drift]="petal.drift + 'px'"
    >
      <span class="petal-sway">
        <svg viewBox="-9 -18 18 19"><path [attr.d]="petalPath" [attr.fill]="petal.color" /></svg>
      </span>
    </span>
  }
</div>

<main class="home-content">
  <p class="home-intro">{{ event.intro }}</p>
  <h1 class="home-names">
    <span class="name name-one">{{ event.partnerOne }}</span>
    <span class="line-two">
      <span class="amp">&amp;</span>
      <span class="name name-two">{{ event.partnerTwo }}</span>
    </span>
  </h1>
  <p class="home-tagline">{{ event.tagline }}</p>
  <button #cta type="button" class="btn btn-lg home-cta" (click)="start.emit(cta)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
      <circle cx="12" cy="13" r="4" />
    </svg>
    {{ event.cta }}
  </button>
</main>

<footer class="home-credit">
  <span>{{ event.poweredBy }}</span>
  <img src="img/lol-photobooth-logo.png" alt="LOL Photobooth" width="900" height="108" />
</footer>
